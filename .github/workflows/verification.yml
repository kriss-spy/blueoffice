name: Verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-verification
          path: artifacts/verification/
          retention-days: 7
          if-no-files-found: warn
  ui:
    name: Fixture browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run verify:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-browser-verification
          path: artifacts/verification/
          retention-days: 7
          if-no-files-found: warn
